name: Build FarmPlug AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed debug APK for direct installation
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Locate and prepare branded APK
        run: |
          set -e
          APK_PATH="$(find android -type f -name '*.apk' -path '*/outputs/apk/debug/*' | head -n 1)"
          test -n "$APK_PATH"
          echo "Using APK: $APK_PATH"
          cp "$APK_PATH" FarmPlug-AI.apk
          test -s FarmPlug-AI.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FarmPlug AI APK
          body: Signed Android APK for direct installation. Built from the FarmPlug AI Android wrapper.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: FarmPlug-AI.apk
