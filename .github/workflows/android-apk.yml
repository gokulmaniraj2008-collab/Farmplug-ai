name: Build FarmPlug AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Record source commit
        run: echo "Building FarmPlug AI v2.0.0 from commit $GITHUB_SHA"
      - name: Build APK
        working-directory: android
        run: gradle -PversionCode=$GITHUB_RUN_NUMBER -PversionName=2.0.0 assembleDebug --no-daemon
      - name: Locate and prepare branded APK
        run: |
          set -e
          APK_PATH="$(find android -type f -name '*.apk' -path '*/outputs/apk/debug/*' | head -n 1)"
          test -n "$APK_PATH"
          echo "Using APK: $APK_PATH"
          cp "$APK_PATH" FarmPlug-AI.apk
          test -s FarmPlug-AI.apk
          sha256sum FarmPlug-AI.apk | tee SHA256SUMS.txt
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FarmPlug AI APK v2
          body: |
            Direct-install Android APK for FarmPlug AI v2.0.0.
            SIH alignment: SIH26131 + SIH26132.
            Source commit: ${{ github.sha }}
            Workflow run: ${{ github.run_number }}
            Version name: 2.0.0
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            FarmPlug-AI.apk
            SHA256SUMS.txt
