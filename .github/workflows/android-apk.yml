name: Build FarmPlug AI production APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

env:
  VERSION_NAME: 2.1.0
  VERSION_CODE: 184

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_B64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
          test -s android/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" assembleRelease --no-daemon

      - name: Verify APK properties
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" FarmPlug-AI.apk
          sha256sum FarmPlug-AI.apk | tee SHA256SUMS.txt
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id FarmPlug-AI.apk
            apkanalyzer manifest version-code FarmPlug-AI.apk
            apkanalyzer manifest version-name FarmPlug-AI.apk
          fi

      - name: Publish production APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v2.1.0
          name: FarmPlug AI v2.1.0
          body: |
            Production Android APK for FarmPlug AI.

            Version: 2.1.0 (184)
            Package: ai.farmplug.app
            Build type: release
            Debuggable: false
            Signing: permanent release keystore configured by the maintainer
            Source commit: ${{ github.sha }}
            Workflow run: ${{ github.run_number }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            FarmPlug-AI.apk
            SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/release.keystore
