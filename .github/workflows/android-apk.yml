name: Build FarmPlug AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Prepare branded APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FarmPlug-AI.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FarmPlug AI APK
          body: Android APK build for FarmPlug AI.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: FarmPlug-AI.apk
