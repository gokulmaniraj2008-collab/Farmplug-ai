name: Build FarmPlug Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-farmplug-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org com.farmplug .

      - name: Prepare FarmPlug Android build
        working-directory: mobile
        run: |
          rm -rf test
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude: []
          linter:
            rules: []
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('    <application', permission + '    <application', 1)
          p.write_text(text)
          print('Using mobile/lib/main.dart as the canonical FarmPlug Android entrypoint')
          print('Verified INTERNET permission in release AndroidManifest.xml')
          PY

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk farmplug-farmer.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" farmplug-farmer.apk \
            --title "FarmPlug Farmer Android ${GITHUB_RUN_NUMBER}" \
            --notes "FarmPlug AI Farmer Android app. Uses the canonical backend-connected Flutter entrypoint and FarmPlug production APIs. Prototype release for testing and SIH demonstration."
          gh release edit "$tag" --latest
