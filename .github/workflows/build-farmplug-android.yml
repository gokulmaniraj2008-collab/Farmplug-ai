name: Build FarmPlug Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-farmplug-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: mobile
        run: flutter create --platforms=android --org com.farmplug .

      - name: Select FarmPlug app entrypoint
        working-directory: mobile
        run: |
          cp lib/main_fixed.dart lib/main.dart
          rm -rf test
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude: []
          linter:
            rules: []
          EOF

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Prepare APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk farmplug-farmer.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" farmplug-farmer.apk \
            --title "FarmPlug Farmer Android ${GITHUB_RUN_NUMBER}" \
            --notes "FarmPlug AI Farmer Android app. Connected to the FarmPlug production backend. Prototype release for testing and SIH demonstration."
          gh release edit "$tag" --latest
