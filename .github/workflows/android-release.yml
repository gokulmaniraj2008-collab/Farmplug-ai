name: Build and Release Farmer Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check canonical Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test ! -e android/settings.gradle
          test ! -e android/build.gradle
          test ! -e android/app/build.gradle
          test ! -e android/app/src/main/java/com/farmplug/ai/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed installable APK
        working-directory: android
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Validate APK integrity, signature and package
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.farmplug.farmer' versionName='1.1.0'"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FarmPlug-Farmer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmPlug-Farmer-Android-${{ github.run_number }}
          path: FarmPlug-Farmer.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "FarmPlug-Farmer.apk#FarmPlug-Farmer-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FarmPlug Farmer Android ${TAG}" \
            --generate-notes
