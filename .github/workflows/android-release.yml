name: Build and Release Farmer Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check canonical Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test ! -e android/settings.gradle
          test ! -e android/build.gradle
          test ! -e android/app/build.gradle
          test ! -e android/app/src/main/java/com/farmplug/ai/MainActivity.java

      - name: Read Android version
        id: android_version
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' android/app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' android/app/build.gradle.kts | head -n1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android version: $VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed installable APK
        working-directory: android
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Validate APK integrity, signature and package
        env:
          EXPECTED_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.farmplug.farmer' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"

      - name: Rename APK
        env:
          VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "FarmPlug-Farmer-v${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmPlug-Farmer-Android-${{ steps.android_version.outputs.version_name }}-${{ github.run_number }}
          path: FarmPlug-Farmer-v${{ steps.android_version.outputs.version_name }}-${{ steps.android_version.outputs.version_code }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
        run: |
          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          APK="FarmPlug-Farmer-v${VERSION_NAME}-${VERSION_CODE}.apk"
          gh release create "$TAG" "$APK#FarmPlug-Farmer-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FarmPlug Farmer Android ${TAG}" \
            --generate-notes
